<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Employee</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .container {
        margin-top: 30px;
      }
      .error {
        color: red;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Add New Employee</h1>
        <a th:href="@{/employees}" class="btn btn-secondary"
          >Back to Employee List</a
        >
      </div>

      <div class="card">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">Employee Information</h5>
        </div>
        <div class="card-body">
          <form
            th:action="@{/employees/add}"
            th:object="${employee}"
            method="post"
          >
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control"
                id="firstName"
                th:field="*{firstName}"
                required
              />
              <div
                class="error"
                th:if="${#fields.hasErrors('firstName')}"
                th:errors="*{firstName}"
              >
                First Name Error
              </div>
            </div>

            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control"
                id="lastName"
                th:field="*{lastName}"
                required
              />
              <div
                class="error"
                th:if="${#fields.hasErrors('lastName')}"
                th:errors="*{lastName}"
              >
                Last Name Error
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                th:field="*{email}"
                required
              />
              <div
                class="error"
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}"
              >
                Email Error
              </div>
            </div>

            <div class="mb-3">
              <label for="position" class="form-label">Position</label>
              <input
                type="text"
                class="form-control"
                id="position"
                th:field="*{position}"
                required
              />
              <div
                class="error"
                th:if="${#fields.hasErrors('position')}"
                th:errors="*{position}"
              >
                Position Error
              </div>
            </div>

            <div class="mb-3">
              <label for="salary" class="form-label">Salary</label>
              <input
                type="number"
                step="0.01"
                class="form-control"
                id="salary"
                th:field="*{salary}"
                required
              />
              <div
                class="error"
                th:if="${#fields.hasErrors('salary')}"
                th:errors="*{salary}"
              >
                Salary Error
              </div>
            </div>

            <button type="submit" class="btn btn-success">Save Employee</button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
