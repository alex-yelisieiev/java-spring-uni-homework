<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 30px; }
        .employee-info { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Employee Details</h1>
            <a th:href="@{/employees}" class="btn btn-secondary">Back to Employee List</a>
        </div>
        
        <div class="card">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0" th:text="${employee.firstName + ' ' + employee.lastName}">Employee Name</h5>
            </div>
            <div class="card-body">
                <div class="row employee-info">
                    <div class="col-md-3 fw-bold">ID:</div>
                    <div class="col-md-9" th:text="${employee.id}">ID</div>
                </div>
                
                <div class="row employee-info">
                    <div class="col-md-3 fw-bold">First Name:</div>
                    <div class="col-md-9" th:text="${employee.firstName}">First Name</div>
                </div>
                
                <div class="row employee-info">
                    <div class="col-md-3 fw-bold">Last Name:</div>
                    <div class="col-md-9" th:text="${employee.lastName}">Last Name</div>
                </div>
                
                <div class="row employee-info">
                    <div class="col-md-3 fw-bold">Email:</div>
                    <div class="col-md-9" th:text="${employee.email}">Email</div>
                </div>
                
                <div class="row employee-info">
                    <div class="col-md-3 fw-bold">Position:</div>
                    <div class="col-md-9" th:text="${employee.position}">Position</div>
                </div>
                
                <div class="row employee-info">
                    <div class="col-md-3 fw-bold">Salary:</div>
                    <div class="col-md-9" th:text="${employee.salary}">Salary</div>
                </div>
                
                <div class="mt-4">
                    <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-warning">Edit</a>
                    <a th:href="@{/employees/delete/{id}(id=${employee.id})}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this employee?')">Delete</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
